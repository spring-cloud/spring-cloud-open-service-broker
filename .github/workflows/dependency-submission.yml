# This workflow submits the resolved Gradle dependency graph to GitHub's Dependency Graph,
# improving Dependabot security alert coverage for dependencies managed via BOMs/platforms
# that GitHub's static Gradle parsing cannot fully resolve.
# For more information see: https://github.com/gradle/actions/blob/main/docs/dependency-submission.md

name: Dependency Submission

on:
  push:
    branches: [ 5.2.*, 5.1.*, 5.0.* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    name: Submit dependency graph
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: liberica
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
