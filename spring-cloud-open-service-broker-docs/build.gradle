import org.asciidoctor.gradle.jvm.AbstractAsciidoctorTask
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'org.springframework.boot' apply false
	id 'org.asciidoctor.jvm.pdf'
	id 'org.asciidoctor.jvm.convert'
}

description = "Spring Cloud Open Service Broker Documentation"

configurations {
	asciidoctorExtensions
}

dependencies {
	implementation platform(SpringBootPlugin.BOM_COORDINATES)
	implementation project(':spring-cloud-open-service-broker-core')
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-tomcat'
	implementation 'io.projectreactor:reactor-core'
	asciidoctorExtensions "io.spring.asciidoctor.backends:spring-asciidoctor-backends:0.0.7"
}

// Consolidated AsciiDoctor configuration
asciidoctorj {
	// Common attributes for all tasks
	attributes([
		"revnumber": project.version,
		"spring-version": project.version,
		"project-version": project.version,
		"branch-or-tag": project.version.endsWith("SNAPSHOT") ? "main" : "v${project.version}",
		"icons": "font",
		"idprefix": "",
		"idseparator": "-",
		"sectanchors": "",
		"sectnums": "",
		"toc": "",
		"docinfo": "shared",
		"allow-uri-read": "",
		"source-highlighter": "highlight.js",
		"highlightjsdir": "js/highlight",
		"highlightjs-theme": "github",
		"includedir": "${project.projectDir}/src/docs/asciidoc",
		"examples-dir": "${project.projectDir}/src/test/java/com/example/servicebroker"
	])
	
	options([
		doctype: "book"
	])
}

// JRuby (embedded in AsciidoctorJ) needs reflective access to JDK IO internals for
// native subprocess control; without this, JDK 16+'s stronger default module
// encapsulation causes it to log a "Native subprocess control requires open access
// to the JDK IO subsystem" warning instead of failing outright.
tasks.withType(AbstractAsciidoctorTask).configureEach {
	jvm {
		jvmArgs("--add-opens", "java.base/java.io=ALL-UNNAMED", "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED")
	}
}

test {
	failOnNoDiscoveredTests = false
}

javadoc {
	enabled = false
}

asciidoctorPdf {
	// Use native source directory instead of manual copying
	sourceDir file("src/docs/asciidoc")
	baseDirFollowsSourceFile()

	// Unlike the asciidoctor (HTML) task, this task defaults to running in-process
	// in the Gradle daemon's own JVM, so the jvm { jvmArgs } above have no effect
	// unless it's forced to run in a real forked process.
	executionMode = 'OUT_OF_PROCESS'
	parallelMode = true

	// PDF-specific sources (only index.adoc for complete document)
	sources {
		include "index.adoc"
	}
	
	// PDF-specific attributes that override common configuration
	attributes = attributes + [
		"source-highlighter": "highlight.js"  // Standardize on highlight.js for consistency
	]
	
	// Add proper input/output declarations for Gradle caching
	inputs.dir(sourceDir)
	inputs.dir("src/test/java/com/example/servicebroker")
	outputs.dir(outputDir)
}

asciidoctor {
	dependsOn asciidoctorPdf
	
	// Configure Spring HTML backend
	configurations "asciidoctorExtensions"
	outputOptions {
		backends "spring-html"
	}
	
	// Use native source directory
	sourceDir file("src/docs/asciidoc")
	baseDirFollowsSourceFile()
	parallelMode = true

	// HTML-specific sources (all .adoc files)
	sources {
		include "*.adoc"
	}
	
	// Native resource handling instead of manual copying
	resources {
		from(sourceDir) {
			include "images/*", "css/**", "js/**"
		}
	}
	
	// Enable document logging for debugging
	logDocuments = true
	
	// HTML-specific attributes that override common configuration  
	attributes = attributes + [
		"stylesdir": "css/",
		"stylesheet": "spring.css",
		"linkcss": true,
		"nofooter": true
	]
	
	// Add proper input/output declarations for Gradle caching
	inputs.dir(sourceDir)
	inputs.dir("src/test/java/com/example/servicebroker")
	outputs.dir(outputDir)
}
